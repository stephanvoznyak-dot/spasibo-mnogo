name: Build APK HTML ZIP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: SDK platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install
        run: npm ci --ignore-scripts && npm run restore:store
      - name: Standalone HTML + zips
        run: npm run pack:downloads
      - name: Capacitor Android sync
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/normal-project.apk
          test -f public/downloads/normal-project.html
          test -f public/downloads/normal-project-src.zip
          test -f public/downloads/normal-project-ios.zip
          test -f public/downloads/normal-project.apk
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spasibo-mnogo-downloads
          path: public/downloads/*
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v$(sed -n 's/.*APP_VERSION = "\(.*\)".*/\1/p' src/version.ts)"
          else
            TAG="${{ github.ref_name }}"
          fi
          NOTES="Industrial sample ${TAG}. Debug-signed APK (not Play Store). Offline HTML. Source ZIP. Xcode project: see IOS_BUILD.md. Download links in the app."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              public/downloads/normal-project.apk \
              public/downloads/normal-project.html \
              public/downloads/normal-project-src.zip \
              public/downloads/normal-project-ios.zip \
              --clobber
          else
            gh release create "$TAG" \
              public/downloads/normal-project.apk \
              public/downloads/normal-project.html \
              public/downloads/normal-project-src.zip \
              public/downloads/normal-project-ios.zip \
              --title "Spasibo mnogo ${TAG}" \
              --notes "$NOTES"
          fi
