name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Canon tests
        run: npm run test:canon
      - name: Canon tests coverage
        run: npx c8 --reporter=text --check-coverage --lines 70 --statements 70 --branches 60 --functions 70 --include='src/protocol/**' --include='src/storage/**' --exclude='**/*.test.ts' npm run test:canon
      - name: Audit
        run: npm audit --audit-level=high
